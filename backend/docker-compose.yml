version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: tatar_ocr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/tatar_ocr.db
      - YANDEX_API_KEY=${YANDEX_API_KEY:-}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
      - YANDEX_GPT_MODEL_URI=${YANDEX_GPT_MODEL_URI:-}
      - YANDEX_OCR_URL=${YANDEX_OCR_URL:-https://ocr.api.cloud.yandex.net/ocr/v1/recognizeText}
      - YANDEX_GPT_URL=${YANDEX_GPT_URL:-https://llm.api.cloud.yandex.net/foundationModels/v1/completion}
      - TASK_EXTRACTOR_MOCK_MODE=${TASK_EXTRACTOR_MOCK_MODE:-false}
    volumes:
      - tatar_ocr_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  tatar_ocr_data:
