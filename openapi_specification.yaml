              schema:
                $ref: '#/components/schemas/BulkImportStudentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/assignments:
    post:
      tags:
      - Classes & Students
      summary: Assign a test to a class
      operationId: assign_test_to_class_api_v1_classes__class_id__assignments_post
      parameters:
      - name: class_id
