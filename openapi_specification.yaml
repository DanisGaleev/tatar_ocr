          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleSubmissionSaveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSubmissionSaveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Submissions Ingestion
      summary: Query Submissions
      operationId: query_submissions_api_v1_submissions_get
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by class ID
          title: Class Id
        description: Filter by class ID
      - name: assignment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by assignment ID
          title: Assignment Id
        description: Filter by assignment ID
      - name: student_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by student ID
          title: Student Id
        description: Filter by student ID
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionItem'
                title: Response Query Submissions Api V1 Submissions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/submissions/recognize:
    post:
      tags:
      - Submissions Ingestion
      summary: Recognize & Verify Blank Photo via C++20 OCR Pipeline
      description: Accepts a photographed A4 blank in RAM (never stored on disk or in DB), runs the C++20 tatar_ocr_native
        pipeline, decodes header QR metadata, verifies answers against the assignment key, and returns full local-parity recognition
        + grading results.
      operationId: recognize_blank_photo_api_v1_submissions_recognize_post
      parameters:
      - name: assignment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional assignment ID overriding QR code
          title: Assignment Id
        description: Optional assignment ID overriding QR code
      - name: variant
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 10
            minimum: 1
          - type: 'null'
          description: Optional variant overriding QR code
          title: Variant
        description: Optional variant overriding QR code
      - name: student_id
        in: query
