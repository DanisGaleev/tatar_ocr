openapi: 3.1.0
info:
  title: «Кара куян» (Tatar OCR) — API Contract Specification
  description: FastAPI Backend for «Кара куян» (Tatar OCR) with Deterministic Task Generator
  version: 1.1.0
paths:
  /api/v1/constructor/task-types:
    get:
      tags:
      - Assignment Constructor
      summary: List supported task generator types
      operationId: list_task_types_api_v1_constructor_task_types_get
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - tt
            - ru
            type: string
          - type: 'null'
          description: Optional language filter ('tt' or 'ru')
          title: Language
        description: Optional language filter ('tt' or 'ru')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/tasks:
    get:
      tags:
      - Assignment Constructor
      summary: Search Task Bank
      operationId: search_task_bank_api_v1_constructor_tasks_get
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term in prompt or answer
          title: Query
        description: Search term in prompt or answer
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - tt
            - ru
            type: string
          - type: 'null'
          description: Filter by language ('tt' or 'ru')
          title: Language
        description: Filter by language ('tt' or 'ru')
      - name: topic_tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic Tag
      - name: grade_level
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 9
            minimum: 1
          - type: 'null'
          title: Grade Level
      - name: max_cells
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Max Cells
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(all|my_tasks)$
          - type: 'null'
          default: all
          title: Scope
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskBankItem'
                title: Response Search Task Bank Api V1 Constructor Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Assignment Constructor
      summary: Create Custom Single Task
      operationId: create_custom_task_api_v1_constructor_tasks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskBankItem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/generate:
    post:
      tags:
      - Assignment Constructor
      summary: Generate tasks deterministically using linguistic generator
      operationId: generate_tasks_api_v1_constructor_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTasksRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTasksResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/tests:
    post:
      tags:
      - Assignment Constructor
      summary: Assemble Modular Test
      operationId: assemble_modular_test_api_v1_constructor_tests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssembleTestRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBundleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/ready-tests:
    get:
      tags:
      - Assignment Constructor
      summary: Browse Ready-Made Complete Tests
      operationId: get_ready_tests_api_v1_constructor_ready_tests_get
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - tt
            - ru
            type: string
          - type: 'null'
          description: Filter ready tests by language
          title: Language
        description: Filter ready tests by language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadyTestItem'
                title: Response Get Ready Tests Api V1 Constructor Ready Tests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/verify-answer:
    post:
      tags:
      - Assignment Constructor
      summary: Verify student answer against expected answer
      operationId: verify_student_answer_api_v1_constructor_verify_answer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAnswerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyAnswerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/scan-task:
    post:
      tags:
      - Assignment Constructor
      summary: Scan exercise image via OCR and classify/structure via YandexGPT
      description: 'Analyzes an uploaded photo or screenshot using OCR & YandexGPT:

        1. Extracts text from image via OCR.

        2. Classifies task type against supported taxonomy (or flags unsupported tasks).

        3. Formats prompt, expected answer (<=12 chars), and physical cell count.

        4. Optionally saves to task bank if save_to_bank=True.'
      operationId: scan_task_from_image_api_v1_constructor_scan_task_post
      parameters:
      - name: save_to_bank
        in: query
        required: false
        schema:
          type: boolean
          description: Persist directly into task bank if valid
          default: false
          title: Save To Bank
        description: Persist directly into task bank if valid
      - name: language
        in: query
        required: false
        schema:
          enum:
          - tt
          - ru
          type: string
          description: Subject language ('tt' or 'ru')
          default: tt
          title: Language
        description: Subject language ('tt' or 'ru')
      - name: grade_level
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 9
            minimum: 1
          - type: 'null'
          description: Optional grade level hint (1..9)
          title: Grade Level
        description: Optional grade level hint (1..9)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_scan_task_from_image_api_v1_constructor_scan_task_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/constructor/scan-task-base64:
    post:
      tags:
      - Assignment Constructor
      summary: Scan exercise from base64 image via OCR & YandexGPT
      description: Base64 variant for mobile apps or JSON-only clients.
      operationId: scan_task_from_base64_api_v1_constructor_scan_task_base64_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanTaskRequestBase64'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTaskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assignments:
    get:
      tags:
      - Assignment Delivery
      summary: List Teacher Assignments
      operationId: list_assignments_api_v1_assignments_get
      parameters:
      - name: class_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter assignments by class ID
          title: Class Id
        description: Filter assignments by class ID
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter assignments by status
          title: Status
        description: Filter assignments by status
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(tt|ru)$
          - type: 'null'
          description: Filter assignments by language ('tt' or 'ru')
          title: Language
        description: Filter assignments by language ('tt' or 'ru')
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assignments/{assignment_id}/batch-blanks.pdf:
    get:
      tags:
      - Assignment Delivery
      summary: Download Batch Printable Blanks PDF (Alias)
      description: Generates a multi-page PDF containing personalized test blanks for all students in the specified class.
      operationId: get_assignment_batch_blanks_pdf_api_v1_assignments__assignment_id__batch_blanks_pdf_get
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          title: Assignment Id
      - name: class_id
        in: query
        required: true
        schema:
          type: string
          description: Class ID whose students to generate blanks for
          title: Class Id
        description: Class ID whose students to generate blanks for
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assignments/{assignment_id}/offline-bundle:
    get:
      tags:
      - Assignment Delivery
      summary: Download Offline Verification Bundle
      operationId: get_offline_bundle_api_v1_assignments__assignment_id__offline_bundle_get
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          title: Assignment Id
      - name: variant
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: Optional variant filter
          title: Variant
        description: Optional variant filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBundleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assignments/{assignment_id}:
    get:
      tags:
      - Assignment Delivery
      summary: Get Assignment Metadata
      operationId: get_assignment_metadata_api_v1_assignments__assignment_id__get
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          title: Assignment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/assignments/{assignment_id}/blank.pdf:
    get:
      tags:
      - Assignment Delivery
      summary: Download Printable Blank PDF (Generic or Single Student)
      description: Generates a print-ready A4 test sheet with 4 corner ArUco markers, QR code, and 10x10 mm answer boxes.
      operationId: get_blank_pdf_api_v1_assignments__assignment_id__blank_pdf_get
      parameters:
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          title: Assignment Id
      - name: variant
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Test variant number
          default: 1
          title: Variant
        description: Test variant number
      - name: student_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Pre-prints student name in header boxes
          title: Student Id
        description: Pre-prints student name in header boxes
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/device-handshake:
    post:
      tags:
      - Teacher Identity
      summary: Registers or verifies the teacher device UUID generated upon first install.
      operationId: device_handshake_api_v1_auth_device_handshake_post
