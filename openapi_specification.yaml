          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHandshakeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHandshakeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes:
    get:
      tags:
      - Classes & Students
      summary: List all classes
      operationId: list_classes_api_v1_classes_get
      parameters:
      - name: X-Teacher-UUID
