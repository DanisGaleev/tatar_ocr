              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/students:
    get:
      tags:
      - Classes & Students
      summary: Get student roster for class
      operationId: get_class_students_api_v1_classes__class_id__students_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          title: Class Id
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassStudentsResponse'
        '422':
