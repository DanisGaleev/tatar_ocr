            application/json:
              schema:
                $ref: '#/components/schemas/ClassAssignmentsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/assignments/{assignment_id}/batch-blanks.pdf:
    get:
      tags:
      - Classes & Students
      summary: Download Batch Printable Blanks PDF for Class
      description: Generates a multi-page PDF containing personalized test blanks for all students in the class.
      operationId: get_class_batch_blanks_pdf_api_v1_classes__class_id__assignments__assignment_id__batch_blanks_pdf_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          title: Class Id
      - name: assignment_id
        in: path
        required: true
        schema:
          type: string
          title: Assignment Id
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/submissions/batch-sync:
