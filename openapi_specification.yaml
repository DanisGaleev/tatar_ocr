          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Classes & Students
      summary: List tests assigned to a class with progress
      operationId: list_class_assignments_api_v1_classes__class_id__assignments_get
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          title: Class Id
      - name: X-Teacher-UUID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Teacher-Uuid
      responses:
